# Grafana dashboard provisioning.
# Grafana loads every dashboard JSON file from /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: "City Transition Dashboards"
    orgId: 1
    folder: "City Transition System"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
