# Blackbox Exporter configuration for uptime monitoring.
# Prometheus asks Blackbox to call a real URL, then stores probe_success,
# probe_duration_seconds, and probe_http_status_code.
modules:
  # http_2xx means the endpoint is considered healthy only when it returns 2xx.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      follow_redirects: true
      preferred_ip_protocol: ip4
