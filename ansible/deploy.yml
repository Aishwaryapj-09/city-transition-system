---
- name: Deploy City Transition System with Kubernetes IaC
  hosts: local_k8s
  gather_facts: false
  vars:
    kube_context: docker-desktop
    namespace: default
    manifest_dir: "{{ playbook_dir }}/../k8s"
    app_deployments:
      - backend
      - frontend
      - prometheus
      - blackbox-exporter
    rolling_image_deployments:
      - backend
      - frontend

  tasks:
    - name: Select Kubernetes context
      ansible.builtin.command:
        argv:
          - kubectl
          - config
          - use-context
          - "{{ kube_context }}"
      changed_when: false

    - name: Apply Kubernetes manifests
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -n
          - "{{ namespace }}"
          - -f
          - "{{ manifest_dir }}"
      register: kubectl_apply
      changed_when: "'created' in kubectl_apply.stdout or 'configured' in kubectl_apply.stdout"

    - name: Restart app deployments to pull latest pushed images
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - restart
          - "deployment/{{ item }}"
          - -n
          - "{{ namespace }}"
      loop: "{{ rolling_image_deployments }}"
      changed_when: true

    - name: Wait for deployment rollouts
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - "deployment/{{ item }}"
          - -n
          - "{{ namespace }}"
          - --timeout=180s
      loop: "{{ app_deployments }}"
      changed_when: false

    - name: Show deployed services
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - services
          - -n
          - "{{ namespace }}"
      register: services
      changed_when: false

    - name: Print service endpoints
      ansible.builtin.debug:
        var: services.stdout_lines
