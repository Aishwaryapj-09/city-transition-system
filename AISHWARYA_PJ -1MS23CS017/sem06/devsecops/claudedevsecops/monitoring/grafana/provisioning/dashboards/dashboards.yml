apiVersion: 1

providers:
  - name: city-transition-dashboards
    orgId: 1
    folder: City Transition
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/files
      foldersFromFilesStructure: false
