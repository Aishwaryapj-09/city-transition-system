# Prometheus configuration for City Transition System (Kubernetes).
#
# Uses Kubernetes service discovery to find pods that opt in to
# scraping with the annotation:
#     prometheus.io/scrape: "true"
#     prometheus.io/path:   "/metrics"
#     prometheus.io/port:   "5000"
#
# No blackbox exporter, no synthetic probes. Per-API monitoring is
# driven by the backend's own prom-client metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: city-transition
    environment: kubernetes

scrape_configs:
  # ---------------------------------------------------------------
  # Self
  # ---------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # ---------------------------------------------------------------
  # Application pods that opt in via annotations
  # ---------------------------------------------------------------
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  # ---------------------------------------------------------------
  # cAdvisor on each node (kubelet exposes it)
  # ---------------------------------------------------------------
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
