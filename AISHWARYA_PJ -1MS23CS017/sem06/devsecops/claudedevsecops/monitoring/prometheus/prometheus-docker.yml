# Prometheus configuration for City Transition System (Docker Compose).
#
# Design notes:
#   - We monitor ONLY real application metrics exposed by the backend
#     via prom-client at /metrics.
#   - There is NO blackbox exporter. Probe / module=http_2xx style
#     synthetic checks are removed deliberately; per-API monitoring
#     comes from the application's own histograms and counters.
#   - cAdvisor is scraped so the Docker monitoring dashboard has
#     container CPU / memory / network data.
#
# All series exposed by the backend are prefixed `city_transition_`.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: city-transition
    environment: docker

scrape_configs:
  # ---------------------------------------------------------------
  # Backend application metrics (prom-client)
  # ---------------------------------------------------------------
  - job_name: city-transition-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:5000
        labels:
          service: city-transition-backend
          component: api

  # ---------------------------------------------------------------
  # Prometheus itself (so we can see scrape health on the dashboard)
  # ---------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          component: monitoring

  # ---------------------------------------------------------------
  # cAdvisor — container resource metrics for the Docker dashboard
  # ---------------------------------------------------------------
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: cadvisor
          component: monitoring
