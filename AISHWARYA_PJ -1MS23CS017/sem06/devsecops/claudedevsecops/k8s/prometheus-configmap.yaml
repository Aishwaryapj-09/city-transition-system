# Prometheus scrape configuration for the Kubernetes deployment.
# Monitors ONLY real application metrics + infrastructure. No blackbox
# exporter, no synthetic probes — per-API monitoring is driven by the
# backend's own prom-client metrics (city_transition_* series).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: "city-transition-k8s"
        environment: "production-demo"

    scrape_configs:
      # Backend prom-client metrics
      - job_name: "city-transition-backend"
        metrics_path: /metrics
        scrape_interval: 10s
        static_configs:
          - targets:
              - backend:5000
            labels:
              service: "backend"
              layer: "application"

      # Host metrics
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - node-exporter:9100
            labels:
              service: "node-exporter"
              layer: "infrastructure"

      # Container metrics
      - job_name: "cadvisor"
        static_configs:
          - targets:
              - cadvisor:8080
            labels:
              service: "cadvisor"
              layer: "container"

      # Prometheus self-monitoring
      - job_name: "prometheus"
        static_configs:
          - targets:
              - localhost:9090
            labels:
              service: "prometheus"
              layer: "monitoring"
