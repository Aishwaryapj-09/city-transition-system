# Demo credentials for Grafana.
# For a real production system, create this Secret outside Git with Jenkins,
# Sealed Secrets, External Secrets, or another secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: default
  labels:
    app: grafana
    component: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
