# Backend API deployment.
# The pod exposes /health for Kubernetes probes and /metrics for Prometheus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        component: api
      annotations:
        # Optional auto-discovery labels for the kubernetes-pods scrape job.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: backend
          image: aishwaryapj09/city-transition-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://host.docker.internal:27017/city-transition-system"
            - name: JWT_SECRET
              value: "mysecretkey123"
      imagePullSecrets:
        - name: dockerhub-secret
