# Prometheus scrape configuration for the Kubernetes deployment.
# This ConfigMap is mounted into the Prometheus pod at
# /etc/prometheus/prometheus.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      # Scrape targets frequently enough for a live demo.
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: "city-transition-k8s"
        environment: "production-demo"

    scrape_configs:
      # Application Performance Monitoring:
      # Pulls the backend metrics created by prom-client.
      - job_name: "city-transition-backend"
        metrics_path: /metrics
        scrape_interval: 10s
        static_configs:
          - targets:
              - backend:5000
            labels:
              service: "backend"
              layer: "application"

      # Infrastructure monitoring:
      # Node Exporter reports host CPU, memory, disk, and network metrics.
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - node-exporter:9100
            labels:
              service: "node-exporter"
              layer: "infrastructure"

      # Container monitoring:
      # cAdvisor reports per-container CPU and memory usage.
      - job_name: "cadvisor"
        static_configs:
          - targets:
              - cadvisor:8080
            labels:
              service: "cadvisor"
              layer: "container"

      # Prometheus self-monitoring.
      - job_name: "prometheus"
        static_configs:
          - targets:
              - localhost:9090
            labels:
              service: "prometheus"
              layer: "monitoring"

      # Uptime monitoring:
      # Blackbox Exporter performs real HTTP checks against important URLs.
      - job_name: "blackbox-http"
        metrics_path: /probe
        params:
          module:
            - http_2xx
        static_configs:
          - targets:
              - http://backend:5000/health
              - http://backend:5000/metrics
              - http://frontend-service:80
            labels:
              probe_type: "http"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
