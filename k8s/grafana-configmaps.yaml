# Grafana provisioning for Kubernetes.
# These ConfigMaps automatically create the Prometheus datasource and the
# City Transition System dashboard when the Grafana pod starts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: default
  labels:
    app: grafana
    component: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
# Dashboard provider tells Grafana where dashboard JSON files are mounted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: default
  labels:
    app: grafana
    component: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "City Transition Dashboards"
        orgId: 1
        folder: "City Transition System"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards

---
# Dashboard JSON cannot contain comments, so each panel uses a clear title and
# description. The same PromQL queries work for Docker and Kubernetes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-city-transition
  namespace: default
  labels:
    app: grafana
    component: monitoring
data:
  city-transition-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "City Transition System monitoring dashboard for API performance, uptime, and container health.",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "1 means the backend process is running.",
          "fieldConfig": { "defaults": { "mappings": [ { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "UP" } }, "type": "value" } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": [ "lastNotNull" ], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "city_transition_up", "legendFormat": "backend", "refId": "A" } ],
          "title": "Backend Health",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Requests per second from the HTTP request counter.",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": [ "lastNotNull" ], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "sum(rate(city_transition_http_requests_total[1m]))", "legendFormat": "requests/sec", "refId": "A" } ],
          "title": "Throughput",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Percentage of HTTP requests returning 4xx or 5xx.",
          "fieldConfig": { "defaults": { "max": 100, "min": 0, "unit": "percent" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": [ "lastNotNull" ], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "100 * sum(rate(city_transition_http_errors_total[5m])) / clamp_min(sum(rate(city_transition_http_requests_total[5m])), 1)", "legendFormat": "error %", "refId": "A" } ],
          "title": "Error Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Backend uptime in seconds.",
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": [ "lastNotNull" ], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "city_transition_process_uptime_seconds", "legendFormat": "uptime", "refId": "A" } ],
          "title": "Application Uptime",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "p95 API response time by route.",
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "options": { "legend": { "calcs": [ "lastNotNull" ], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [ { "expr": "histogram_quantile(0.95, sum(rate(city_transition_http_request_duration_seconds_bucket[5m])) by (le, route))", "legendFormat": "{{route}} p95", "refId": "A" } ],
          "title": "API Response Time p95",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Backend CPU and memory usage from Node.js process metrics.",
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "options": { "legend": { "calcs": [ "lastNotNull" ], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            { "expr": "rate(city_transition_process_cpu_seconds_total[5m])", "legendFormat": "backend CPU", "refId": "A" },
            { "expr": "city_transition_process_resident_memory_bytes / 1024 / 1024", "legendFormat": "backend memory MB", "refId": "B" }
          ],
          "title": "Backend CPU and Memory",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Container resource usage from cAdvisor.",
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 7,
          "options": { "legend": { "calcs": [ "lastNotNull" ], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{image!=\"\"}[5m])) by (name)", "legendFormat": "{{name}} CPU", "refId": "A" },
            { "expr": "sum(container_memory_usage_bytes{image!=\"\"} / 1024 / 1024) by (name)", "legendFormat": "{{name}} memory MB", "refId": "B" }
          ],
          "title": "Container Resource Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "HTTP uptime and endpoint latency from Blackbox Exporter.",
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 8,
          "options": { "legend": { "calcs": [ "lastNotNull" ], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            { "expr": "probe_success{job=\"blackbox-http\"}", "legendFormat": "{{instance}} up", "refId": "A" },
            { "expr": "probe_duration_seconds{job=\"blackbox-http\"}", "legendFormat": "{{instance}} latency", "refId": "B" }
          ],
          "title": "Uptime and Probe Latency",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [ "city-transition", "devsecops", "prometheus", "grafana" ],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "City Transition System - DevSecOps Monitoring",
      "uid": "city-transition-monitoring",
      "version": 1
    }
