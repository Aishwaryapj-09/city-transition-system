# Blackbox Exporter configuration for Kubernetes uptime monitoring.
# Prometheus calls Blackbox, Blackbox calls the real URL, and Grafana shows
# probe_success, probe_duration_seconds, and probe_http_status_code.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: default
  labels:
    app: blackbox-exporter
    component: monitoring
data:
  blackbox.yml: |
    modules:
      http_api_expected:
        prober: http
        timeout: 5s
        http:
          valid_status_codes:
            - 200
            - 201
            - 204
            - 301
            - 302
            - 400
            - 401
            - 403
          valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
          follow_redirects: true
          preferred_ip_protocol: ip4
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
          follow_redirects: true
          preferred_ip_protocol: ip4
